name: Slack PR reactions (reusable)
on:
  workflow_call:
jobs:
  react:
    if: >-
      ${{ (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Add reaction to Slack message
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const MARKER = '<!-- slack-ref '

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            })
            const markerComment = comments.find(c => c.body && c.body.includes(MARKER))
            if (!markerComment) {
              core.warning('No Slack message ref on this PR, skipping reaction.')
              return
            }
            const ref = JSON.parse(markerComment.body.match(/<!-- slack-ref (.*?) -->/)[1])

            const name = context.eventName === 'pull_request_review'
              ? 'white_check_mark'
              : 'twisted_rightwards_arrows'

            const res = await fetch('https://slack.com/api/reactions.add', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                Authorization: `Bearer ${{ secrets.SLACK_BOT_TOKEN }}`,
              },
              body: JSON.stringify({ channel: ref.channel, timestamp: ref.ts, name }),
            })
            const data = await res.json()
            // already_reacted fires on a re-approval; not an error worth failing on.
            if (!data.ok && data.error !== 'already_reacted') {
              core.setFailed(`Slack reactions.add failed: ${data.error}`)
            }
